name: _Image (reusable)

# onnxruntime wheel 流水线：构建 wheel → 发布 wheelhouse 镜像 → 逐平台冒烟。
#
# Dockerfile 的 `wheel` 阶段是 `FROM scratch` + `/wheels`，所以「镜像」本身就是
# wheel 的载体：发布模式把它按 digest 推到 Docker Hub，冒烟脚本再从 registry 取回
# 同一份字节，保证「验的就是发的那份」。
#
# 阶段划分（与 pycurl-docker / ddddocr 一致的四段解耦）：
#   1) plan   ：算出构建分组、冒烟矩阵、平台全集与「是否全量」，下游只吃 outputs
#   2) build  ：每个平台一个 job，各自在自己的 runner 上编译（组间并行）；
#               发布模式 push-by-digest（不产任何中间 tag），非发布模式产 wheel 目录
#   3) smoke  ：每个平台一个 job，在**干净的 alpine** 里装 wheel 并真跑推理
#   4) publish：全部构建 + 全部冒烟通过、且平台集合完整，才合并 manifest 打正式 tag
#
# 为什么构建与冒烟分成两个 job：编译失败与运行时失败是两种独立信号；且冒烟机
# 只需要一个几 MB 的 wheel，不必再占一台能编译 onnxruntime 的大机器。
on:
  workflow_call:
    inputs:
      push:
        description: '构建并冒烟通过后是否发布（tag 推送恒为发布）'
        type: boolean
        default: false
      platforms:
        description: '平台子集（空 = 默认平台集合）'
        type: string
        default: ''
      apk_mirror:
        description: 'apk 镜像源（空 = 官方源）'
        type: string
        default: ''
      alpine_version:
        description: 'alpine 版本，决定 Python 小版本与 wheel 的 cpXX tag'
        type: string
        default: '3.24'
      onnx_version:
        description: 'onnxruntime 版本'
        type: string
        default: '1.24.4'
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）'
        type: boolean
        default: true
      dockerfile:
        description: '用哪份 Dockerfile 构建 wheel'
        type: string
        default: 'Dockerfile.repackage'
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=不复用旧层'
        type: string
        default: ''
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

env:
  PUBLISH: ${{ inputs.push || startsWith(github.ref, 'refs/tags/') }}
  IMAGE: docker.io/a76yyyy/onnxruntime
  # 默认只跑三大主流架构：原生 runner 能编译 amd64/arm64，armv7 靠 QEMU 但耗时
  # 还算可控。ppc64le / riscv64 只能在 QEMU 下全量编译（单平台数小时），风险高，
  # 留作显式输入按需加。
  DEFAULT_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Plan
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Compute matrices
        id: plan
        # 只读 inputs，不读仓库，所以这里不 checkout（省一次网络往返）
        env:
          PLATFORM_INPUT: ${{ inputs.platforms }}
          NATIVE_ARM: ${{ inputs.native_arm && 'true' || 'false' }}
        run: |
          # 必须 -e：下面 python 用 sys.exit("::error::...") 报错，没有 -e 时
          # 脚本会带着半截 matrix 继续往下跑，真正的错误要到下游 job 才暴露
          set -euo pipefail
          python3 - <<'PY' > /tmp/plan.out
          import json, os, sys

          default = [p.strip() for p in os.environ["DEFAULT_PLATFORMS"].split(",") if p.strip()]
          raw = (os.environ.get("PLATFORM_INPUT") or "").strip()
          plats = [p.strip() for p in raw.split(",") if p.strip()] if raw else default

          # 可选平台 = alpine:3.24 官方有变体、且 onnxruntime 上游支持编译的架构。
          # 刻意不列 386 / s390x（onnxruntime 不支持，见 README 的 Tips）与 loong64
          # （alpine 官方无该变体，要发布得先换基座镜像）。ppc64le / riscv64 只靠
          # QEMU 全量编译，单平台数小时，只在确实需要时手动指定。
          allowed = {"linux/amd64", "linux/arm64", "linux/arm/v7",
                     "linux/arm/v6", "linux/ppc64le", "linux/riscv64"}
          bad = [p for p in plats if p not in allowed]
          if bad:
              sys.exit("::error::未知平台: %s（可选: %s）" % (",".join(bad), ",".join(sorted(allowed))))
          dup = sorted({p for p in plats if plats.count(p) > 1})
          if dup:
              sys.exit("::error::平台重复: %s" % ",".join(dup))

          arm_runner = "ubuntu-24.04-arm" if os.environ.get("NATIVE_ARM") == "true" else "ubuntu-latest"

          # 一个平台一个 build job。刻意不把多个平台塞进同一个 buildx 调用：
          #   * onnxruntime 是重编译（4 核 runner 上 amd64 约 19 分钟），两平台并行会 OOM；
          #   * 单平台构建的 local 导出直接落在 dest 根目录，不必按平台分子目录；
          #   * 单平台 push-by-digest 得到的是单平台 manifest digest，冒烟可以直接
          #     按 digest 取回同一份字节，不必赌多平台 index 的选择逻辑。
          def group_of(p):
              return p.replace("linux/", "").replace("/", "-")

          def runner_of(p):
              return arm_runner if p == "linux/arm64" else "ubuntu-latest"

          include = [{
              "platform": p,
              "group": group_of(p),
              "runner": runner_of(p),
          } for p in plats]

          smoke = [{
              "platform": p,
              "group": group_of(p),
              "runner": runner_of(p),
          } for p in plats]

          print("matrix=" + json.dumps({"include": include}))
          print("smoke_matrix=" + json.dumps({"include": smoke}))
          print("expected=" + ",".join(sorted(plats)))
          print("full=%s" % str(sorted(plats) == sorted(default)).lower())
          PY
          echo "--- 构建矩阵 ---"
          sed -n 's/^matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- 冒烟矩阵 ---"
          sed -n 's/^smoke_matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- 其余 ---"
          grep -Ev '^(matrix|smoke_matrix)=' /tmp/plan.out
          cat /tmp/plan.out >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # 原生架构实测约 19 分钟；armv7 / riscv64 等要在 QEMU 下单步模拟编译，
    # 可能数小时。给到 GitHub 单 job 上限附近，避免慢架构被超时误杀。
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        # 非本机架构（如 ubuntu-latest 上的 armv7）要靠 binfmt 才能执行 RUN 里的编译
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build wheel image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          # 只到 wheel 阶段：后面没有运行时镜像，产物就是这个 scratch 镜像里的 /wheels
          target: wheel
          platforms: ${{ matrix.platform }}
          # 发布模式按 digest 推送：各平台并行构建，用 digest 传递产物不必协调 tag
          # 命名，也不在 tag 列表里留下对使用者无意义、却可被拉取的中间产物。
          # 非发布模式落盘，供同一次运行的冒烟 job 直接取用。
          push: ${{ env.PUBLISH == 'true' }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true', 'docker.io/a76yyyy/onnxruntime') || 'type=local,dest=./dist' }}
          build-args: |
            ALPINE_VERSION=${{ inputs.alpine_version }}
            ONNX_VERSION=${{ inputs.onnx_version }}
            APK_MIRROR=${{ inputs.apk_mirror }}
          # 不产 attestation 清单，保持 manifest 只有平台条目（旧客户端兼容）
          provenance: false
          cache-from: type=gha,scope=onnx-${{ matrix.group }}${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=onnx-${{ matrix.group }}${{ inputs.cache_bust }},ignore-error=true
      - name: Show wheel
        if: env.PUBLISH != 'true'
        # 顺带把 SHA256SUMS 打进日志：artifact 里存的就是这份清单，出问题时可追溯
        run: ls -l dist/wheels && cat dist/wheels/SHA256SUMS
      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.group }}.digest"
          echo "digest: $(cat "/tmp/digests/${{ matrix.group }}.digest")"
      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.group }}
          path: /tmp/digests/*.digest
          retention-days: 1
          if-no-files-found: error
      - name: Upload wheel
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带平台，避免多平台互相覆盖
          name: wheel-${{ matrix.group }}
          path: dist/wheels
          retention-days: 1
          if-no-files-found: error

  smoke:
    needs: [plan, build]
    name: Smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # 装 wheel + 跑一次推理，本机架构是秒级；QEMU 下解压 15MiB wheel、
    # 加载 20MiB 主库都要放大十几倍，留足余量
    timeout-minutes: 90
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    steps:
      - name: Checkout
        # 冒烟脚本本体在仓库里（tests/smoke.py），挂进容器执行
        uses: actions/checkout@v4
      - name: Set up QEMU
        # 冒烟容器要按目标架构真跑（armv7 在 x86 runner 上全靠 binfmt）
        uses: docker/setup-qemu-action@v3
      - name: Download digest
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.group }}
          path: /tmp/digest
      - name: Download wheel
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.group }}
          path: dist/wheels
      - name: Fetch wheel from registry
        if: env.PUBLISH == 'true'
        # 发布模式下验的就是 registry 里那份字节，而不是构建机上残留的临时文件
        run: |
          set -eux
          DIGEST=$(cat /tmp/digest/*.digest)
          docker pull --platform "${{ matrix.platform }}" "${IMAGE}@${DIGEST}"
          # wheel 阶段是 FROM scratch，镜像没有 Cmd，`docker create` 必须显式给一个
          # 命令才不报 "no command specified"；容器根本不会启动，命令本身无所谓
          docker create --name wheelhouse "${IMAGE}@${DIGEST}" /nonexistent
          mkdir -p dist/wheels
          docker cp wheelhouse:/wheels/. dist/wheels/
          docker rm wheelhouse
          ls -l dist/wheels
      - name: Install wheel and run smoke
        env:
          APK_MIRROR: ${{ inputs.apk_mirror }}
          ALPINE: ${{ inputs.alpine_version }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.onnx_version }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$PLATFORM" \
            -e APK_MIRROR="$APK_MIRROR" \
            -e PLATFORM="$PLATFORM" \
            -e VERSION="$VERSION" \
            -v "$PWD/dist/wheels:/wheels:ro" \
            -v "$PWD/tests:/tests:ro" \
            "alpine:$ALPINE" sh -euc '
              if [ -n "${APK_MIRROR:-}" ]; then
                sed -i "s|https://dl-cdn.alpinelinux.org|${APK_MIRROR%/}|g" /etc/apk/repositories
              fi
              apk add --no-cache python3 uv
              cd /wheels && sha256sum -c SHA256SUMS
              # 首选让 uv 从 PyPI 解析全部依赖：连 Requires-Dist 是否可满足一起验了
              if ! uv pip install --system --break-system-packages /wheels/*.whl; then
                # numpy 只为 x86_64 / aarch64 出 cp314 的 musllinux 轮子，armv7 /
                # ppc64le / riscv64 上 uv 会退回源码编译而失败。这些架构改用 apk 的
                # 预编译 numpy：uv 看到 numpy 已满足，只解析剩下的纯 python 依赖。
                echo "::warning::PyPI 无可用的 numpy 二进制轮子，改用 apk py3-numpy 后重试"
                apk add --no-cache py3-numpy
                uv pip install --system --break-system-packages /wheels/*.whl
              fi
              python3 /tests/smoke.py "$PLATFORM" "$VERSION"
            '

  publish:
    needs: [plan, build, smoke]
    name: Merge digests and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 闸门（fail-closed）：① 有发布意图 ② build 与 smoke 都成功（任何一个失败/取消
    # 都不发布，也不做「部分成功就先发一半」）③ 平台集合完整（见下一步）
    if: ${{ (inputs.push || startsWith(github.ref, 'refs/tags/')) && !cancelled() && needs.build.result == 'success' && needs.smoke.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Guard - reject partial publish
        if: ${{ needs.plan.outputs.full != 'true' }}
        run: |
          echo "::error::平台子集（${{ needs.plan.outputs.expected }}）不是完整平台集合，禁止发布。"
          echo "::error::用子集发布会把多平台正式 manifest 覆盖成不完整版本。"
          echo "::error::要发布请留空 platforms 走全平台构建。"
          exit 1
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create multi-arch manifests
        env:
          VERSION: ${{ inputs.onnx_version }}
        run: |
          set -euo pipefail
          SRCS=""
          for f in /tmp/digests/*.digest; do
            SRCS="$SRCS ${IMAGE}@$(cat "$f")"
          done
          echo "聚合来源:${SRCS}"

          # 两个 tag 都是确定性的：版本号来自输入（与 Dockerfile 的 ONNX_VERSION
          # 同源），latest 是滚动 tag。tag 事件与 dispatch 发布走的是同一套命名。
          TAGS="${VERSION} latest"
          for TAG in $TAGS; do
            echo "::group::合并 -> ${IMAGE}:${TAG}"
            docker buildx imagetools create -t "${IMAGE}:${TAG}" $SRCS
            echo "::endgroup::"
          done
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"
      - name: Verify manifest platform completeness
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        # 合并后回读 manifest：digest 数量对不等于 manifest 里平台对（历史上有过
        # 同一平台被合并两次、另一平台被吞掉的情况），所以按集合比对而不是按数量
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          expected = {p.strip() for p in os.environ["EXPECTED"].split(",") if p.strip()}
          image = os.environ["IMAGE"]

          def platforms(tag):
              try:
                  raw = subprocess.run(
                      ["docker", "buildx", "imagetools", "inspect", "--raw", tag],
                      capture_output=True, text=True, check=True).stdout
              except subprocess.CalledProcessError as e:
                  raise SystemExit("::error::无法读取 %s 的 manifest: %s"
                                   % (tag, (e.stderr or "").strip()[:300]))
              idx = json.loads(raw)
              out = set()
              for m in idx.get("manifests", []):
                  p = m.get("platform") or {}
                  arch = p.get("architecture")
                  if not arch or arch == "unknown":
                      continue
                  variant = p.get("variant")
                  out.add("%s/%s%s" % (p.get("os", "linux"), arch, "/" + variant if variant else ""))
              return out

          failed = False
          for tag in os.environ["TAGS"].split():
              full = "%s:%s" % (image, tag)
              got = platforms(full)
              if got == expected:
                  print("OK   %s -> %d 平台" % (tag, len(got)))
                  continue
              failed = True
              print("FAIL %s" % full)
              print("     缺失: %s" % (sorted(expected - got) or "无"))
              print("     多余: %s" % (sorted(got - expected) or "无"))
          if failed:
              sys.exit("::error::manifest 平台完整性校验失败")
          PY
