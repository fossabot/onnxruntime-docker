name: Build Image

# 薄调用方：真正的流水线在 _image.yml（plan → build → smoke → publish）。
# 这里只做两件事：决定什么时候跑、把 dispatch 的输入原样传下去。
#
# 每个平台产出两个镜像：
#   <onnx_version>            可运行镜像（python3 + onnxruntime + numpy），滚动 tag latest
#   <onnx_version>-wheelhouse wheel 载体镜像（scratch + /wheels），滚动 tag wheelhouse
#
# 只在两种情况下构建：
#   * workflow_dispatch —— 手动触发，默认只构建+冒烟、不发布
#   * tag 推送          —— 正式发布
# 普通 push 到 main 不构建：QEMU 架构一次全量构建以小时计，每次 merge 都跑既费额度
# 也没有额外信息（改动是否可用，dispatch 一次就能验）。
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      push:
        description: '勾选=发布滚动/版本标签；不勾选=只产 dev 标签（同样推到两个 registry，供测试拉取）'
        type: boolean
        default: false
      platforms:
        description: '要构建的平台，逗号分隔不要空格；留空=默认全部 6 个（linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64）。子集构建禁止发布'
        type: string
        default: ''
      apk_mirror:
        description: 'apk 镜像源，如 https://mirrors.tuna.tsinghua.edu.cn（留空=官方源）'
        type: string
        default: ''
      alpine_version:
        description: 'alpine 版本；决定 Python 小版本，进而决定 wheel 的 cpXX tag'
        type: string
        default: '3.24'
      onnx_version:
        description: 'onnxruntime 版本（同时是 runtime 镜像的 tag；wheelhouse 镜像的 tag 是 <ver>-wheelhouse）'
        type: string
        default: '1.24.4'
      numpy_version:
        description: 'numpy 版本（wheelhouse 里一并重打包的那个 wheel）'
        type: string
        default: '2.4.6'
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）；runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=强制不复用旧层（基准测试用）'
        type: string
        default: ''
jobs:
  image:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      # tag 推送时 github.event.inputs 全是 null，各输入退回 workflow_call 里的默认值
      push: ${{ github.event.inputs.push == 'true' }}
      platforms: ${{ github.event.inputs.platforms || '' }}
      apk_mirror: ${{ github.event.inputs.apk_mirror || '' }}
      alpine_version: ${{ github.event.inputs.alpine_version || '3.24' }}
      onnx_version: ${{ github.event.inputs.onnx_version || '1.24.4' }}
      numpy_version: ${{ github.event.inputs.numpy_version || '2.4.6' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      cache_bust: ${{ github.event.inputs.cache_bust || '' }}
      # 仓库只有一个 Dockerfile（重打包路径，两个出口）。源码编译路径已归档到
      # archive/source-build 分支，CI 不再构建它。
      dockerfile: Dockerfile
